name: Sync upstream tags

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-tags
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream tags
        run: >-
          git fetch --force --no-tags https://github.com/EpicGames/lore.git
          '+refs/tags/*:refs/tags/upstream/*'

      - name: Publish missing tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          while IFS= read -r source_ref; do
            tag_name="${source_ref#refs/tags/upstream/}"
            source_object="$(git rev-parse "$source_ref")"
            target_object="$(git ls-remote --refs origin "refs/tags/${tag_name}" | awk '{print $1}')"

            if [ -z "$target_object" ]; then
              git push origin "${source_ref}:refs/tags/${tag_name}"
            elif [ "$source_object" != "$target_object" ]; then
              echo "Tag ${tag_name} already exists on origin with a different object."
              exit 1
            else
              echo "Tag ${tag_name} is already synchronized."
            fi
          done < <(git for-each-ref --format='%(refname)' refs/tags/upstream/)